[project]
name = "ifood-bot"
version = "0.1.0"
description = "Telegram bot for ITMO food"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiogram>=3.31.0",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
